/* ---------- login ---------- */
#gate{position:fixed;inset:0;background:var(--olive);display:grid;place-items:center;z-index:100}
#gate .box{width:min(340px,86vw);text-align:center}
#gate .mark-lock{width:200px;height:141px;background:var(--ivory);margin:0 auto 34px;opacity:.95}
#gate input{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(241,238,232,.35);
  color:var(--ivory);text-align:center;letter-spacing:.7em;padding:10px 0 12px;font-size:20px;outline:none}
#gate input:focus{border-color:var(--beige)}
#gate label{display:block;color:rgba(241,238,232,.62);font-size:12.5px;margin-bottom:18px}
#gate button{margin-top:26px;color:var(--olive);background:var(--ivory);padding:11px 34px;border-radius:var(--r);font-weight:600}
#gate .err{color:var(--beige);font-size:12.5px;height:18px;margin-top:14px}

/* ---------- shell ---------- */
#app{display:none;min-height:100%}
#app.on{display:grid;grid-template-columns:1fr 232px}
aside{background:var(--olive);color:var(--ivory);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 0 14px}
aside .brand{padding:0 22px 26px;border-bottom:1px solid rgba(241,238,232,.14)}
aside .brand .mark-lock{width:132px;height:93px;background:var(--ivory);opacity:.92}
nav{flex:1;overflow:auto;padding:14px 12px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);color:rgba(241,238,232,.78);text-decoration:none;font-size:14px}
nav a:hover{background:rgba(241,238,232,.08);color:#fff}
nav a.on{background:var(--ivory);color:var(--olive);font-weight:600}
nav a i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;flex:none}
nav a.on i{opacity:1}
nav .sep{font-size:11px;color:rgba(241,238,232,.42);padding:16px 12px 6px;letter-spacing:.04em}
aside .foot{padding:12px 22px 0;border-top:1px solid rgba(241,238,232,.14);font-size:11.5px;color:rgba(241,238,232,.5);display:flex;justify-content:space-between;align-items:center}
aside .foot button{color:rgba(241,238,232,.72);font-size:11.5px}

main{padding:30px 34px 70px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.head h1{font-weight:400;font-size:27px;letter-spacing:-.01em}
.head p{color:var(--ink-60);font-size:13px;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{background:var(--olive);color:var(--ivory);padding:9px 18px;border-radius:var(--r);font-size:13.5px;font-weight:600}
.btn:hover{background:#5d6146}
.btn.ghost{background:transparent;color:var(--olive);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--ivory)}
.btn.danger{background:transparent;color:var(--minus);border:1px solid rgba(126,59,59,.3)}
.btn.sm{padding:6px 12px;font-size:12.5px;font-weight:400}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--olive-mid)}
label.f{display:block;font-size:12px;color:var(--ink-60);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ---------- ledger strip (signature) ---------- */
.strip{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.strip>div{padding:18px 20px 16px;border-left:1px solid var(--line-soft)}
.strip>div:last-child{border-left:0}
.strip .k{font-size:12px;color:var(--ink-60)}
.strip .v{font-size:31px;line-height:1.25;margin-top:2px}
.strip .v small{font-size:14px;color:var(--ink-60);font-family:'Cairo',sans-serif}
.strip .d{font-size:11.5px;margin-top:2px;color:var(--ink-60)}
.up{color:var(--plus)} .down{color:var(--minus)}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-top:22px}
.panel>h3{font-weight:600;font-size:14px;padding:15px 20px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel .body{padding:20px}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}

table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--ink-60);font-weight:600;text-align:right;padding:11px 20px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 20px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfaf5}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;background:var(--ivory);color:var(--ink-60);border:1px solid var(--line-soft)}
.tag.low{background:#faf0ee;color:var(--minus);border-color:#eeddd9}
.tag.ok{background:#f0f3ea;color:var(--plus);border-color:#e2e8d6}
.empty{padding:46px 20px;text-align:center;color:var(--ink-60);font-size:13.5px}
.empty .mark-emb{width:36px;height:44px;background:var(--line);margin:0 auto 14px}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:right;transition:border-color .12s}
.prod:hover{border-color:var(--olive-mid)}
.prod .nm{font-size:14px;font-weight:600}
.prod .ar{font-size:12px;color:var(--ink-60)}
.prod .pr{margin-top:8px;font-size:19px}
.prod .st{font-size:11.5px;color:var(--ink-60)}
.prod:disabled{opacity:.42;cursor:not-allowed}
.cart{background:#fff;border:1px solid var(--line);border-radius:var(--r);position:sticky;top:22px}
.cart .items{max-height:36vh;overflow:auto}
.ci{display:flex;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-soft)}
.ci .nm{flex:1;font-size:13px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r)}
.qty button{width:26px;height:26px;line-height:1;color:var(--ink-60)}
.qty span{width:26px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.sum{padding:14px 16px;border-top:1px solid var(--line)}
.sum .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--ink-60)}
.sum .row.tot{color:var(--ink);font-size:15px;padding-top:9px;margin-top:7px;border-top:1px solid var(--line-soft)}
.sum .row.tot b{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500}

/* ---------- chart ---------- */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding:0 4px}
.chart .bar{flex:1;background:var(--sage);border-radius:2px 2px 0 0;min-height:2px;position:relative;transition:background .12s}
.chart .bar:hover{background:var(--olive)}
.chart .bar span{position:absolute;bottom:-20px;right:50%;transform:translateX(50%);font-size:10.5px;color:var(--ink-60);white-space:nowrap}
.chart-wrap{padding:20px 20px 42px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(42,44,34,.45);display:none;z-index:60;padding:24px;overflow:auto}
#modal.on{display:grid;place-items:start center}
#modal .sheet{background:var(--paper);border-radius:var(--r);width:min(560px,100%);margin-top:6vh;box-shadow:0 24px 60px rgba(42,44,34,.22)}
#modal h3{font-weight:600;font-size:16px;padding:18px 22px;border-bottom:1px solid var(--line)}
#modal .mbody{padding:22px}
#modal .mfoot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}
#toast{position:fixed;bottom:26px;right:26px;background:var(--ink);color:var(--ivory);padding:11px 20px;border-radius:var(--r);font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:90}
#toast.on{opacity:1;transform:none}

/* ---------- invoice / print ---------- */
#print{display:none}
@media print{
  body{background:#fff}
  #app,#gate,#modal,#toast{display:none!important}
  #print{display:block;padding:0}
  @page{size:A5;margin:14mm}
}
#print .inv{color:#2A2C22;font-size:12px}
#print .ivhead{text-align:center;border-bottom:1px solid #DCD8CB;padding-bottom:14px;margin-bottom:16px}
#print .ivhead .mark-lock{width:150px;height:106px;background:#6F7354;margin:0 auto 8px}
#print table{width:100%;border-collapse:collapse;margin:12px 0}
#print th{font-size:11px;border-bottom:1px solid #2A2C22;padding:6px 4px}
#print td{padding:7px 4px;border-bottom:1px solid #E8E4D9;font-size:12px}
#print .tot{display:flex;justify-content:space-between;font-size:15px;padding-top:10px;margin-top:6px;border-top:1px solid #2A2C22}
#print .note{text-align:center;font-size:10.5px;color:#5E6153;margin-top:22px;line-height:1.9}


/* ---------- embedded inside Lantana admin ---------- */
body.embed{background:transparent}
body.embed #gate{display:none!important}
body.embed #app.on{grid-template-columns:1fr}
body.embed aside{position:sticky;top:0;height:auto;width:100%;flex-direction:row;padding:0;order:-1;z-index:20;overflow:auto}
body.embed aside .brand,body.embed aside .foot{display:none}
body.embed nav{display:flex;padding:7px 8px;gap:2px;overflow-x:auto}
body.embed nav .sep{display:none}
body.embed nav a{white-space:nowrap;padding:8px 13px;font-size:13px}
body.embed nav a i{display:none}
body.embed main{padding:26px 26px 60px}
@media(max-width:900px){body.embed main{padding:18px 14px 40px}}

@media(max-width:900px){
  #app.on{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;top:auto;height:auto;width:100%;z-index:50;flex-direction:row;padding:0;overflow:auto}
  aside .brand,aside .foot{display:none}
  nav{display:flex;padding:6px;gap:2px}
  nav .sep{display:none}
  nav a{white-space:nowrap;font-size:12.5px;padding:8px 11px}
  nav a i{display:none}
  main{padding:20px 16px 96px}
  .strip{grid-template-columns:1fr 1fr}
  .strip>div{border-bottom:1px solid var(--line-soft)}
  .cols,.pos,.grid2,.grid3{grid-template-columns:1fr}
  .cart{position:static}
  td,th{padding:11px 12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--olive-mid);outline-offset:2px}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="mark mark-lock"></div>
    <label for="pin">أدخل رمز الدخول</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <div class="err" id="pinerr"></div>
    <button id="pinbtn">دخول</button>
  </div>
</div>

<div id="app">
  <main>
    <div id="view"></div>
  </main>
  <aside>
    <div class="brand"><div class="mark mark-lock"></div></div>
    <nav id="nav"></nav>
    <div class="foot"><span id="today"></span><button id="lock">قفل</button></div>
  </aside>
</div>

<div id="modal"><div class="sheet"><h3 id="mtitle"></h3><div class="mbody" id="mbody"></div><div class="mfoot" id="mfoot"></div></div></div>
<div id="toast"></div>
<div id="print"></div>

<script>
(function(){
"use strict";

/* ===================== storage ===================== */
var KEY="lantana_erp_v1", mem=null;
function canLS(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}catch(e){return false}}
var LS=canLS();
function load(){
  try{ var raw = LS? localStorage.getItem(KEY) : mem; return raw? JSON.parse(raw):null; }catch(e){return null}
}
function save(){ var s=JSON.stringify(DB); if(LS){try{localStorage.setItem(KEY,s)}catch(e){toast("تعذّر الحفظ: الذاكرة ممتلئة")}} else mem=s; }

/* ===================== seed ===================== */
function seed(){
  var P=function(id,en,ar,size,price,cost,stock){return{id:id,en:en,ar:ar,size:size,price:price,cost:cost,stock:stock||0,min:12,active:true}};
  return {
    settings:{
      pin:"1234", brand:"LANTANA", brandAr:"لانتانا",
      branch:"دمشق · شارع الشعلان", phone:"", base:"USD", min:12,
      rates:{USD:1, SYP:13000, AED:3.67, SAR:3.75, EUR:0.92, GBP:0.79, TRY:34},
      cashOpen:0, invNo:1001, footer:"شكراً لثقتكم · لانتانا للعطور"
    },
    products:[
      P("barq","BARQ","برق","50ml",25,9.64,0),
      P("asrar","ASRAR","أسرار","50ml",25,9.64,0),
      P("layal","LAYAL","ليال","50ml",25,9.64,0),
      P("waqar","WAQAR","وقار","50ml",25,9.64,0),
      P("moon","MOON","مون","50ml",25,9.64,0),
      P("lunea","LUNÉA","لونيا","50ml",25,9.64,0),
      P("yasmeen","YASMEEN","ياسمين","50ml",25,10.14,0),
      P("misk","MISK","مسك","50ml",25,10.14,0),
      P("lunea100","LUNÉA","لونيا","100ml",35,12.14,0),
      P("giftset","GIFT SET","سيت الهدية","4×30ml",45,28.86,0),
      P("mini30","30 ML","قنينة مفردة","30ml",15,5.80,0)
    ],
    sales:[], purchases:[], expenses:[], customers:[], cashmoves:[], capital:[]
  };
}
var DB = load() || seed();
if(!DB.settings.rates) DB.settings={...seed().settings,...DB.settings};
if(!DB.capital) DB.capital=[];

/* ===================== helpers ===================== */
var EMBED=/[?&]embed=1/.test(location.search)||(function(){try{return window.self!==window.top}catch(e){return true}})();
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
var CUR=["USD","SYP","AED","SAR","EUR","GBP","TRY"];
var CURAR={USD:"دولار",SYP:"ليرة سورية",AED:"درهم",SAR:"ريال",EUR:"يورو",GBP:"جنيه",TRY:"ليرة تركية"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){var d=new Date();return d.toISOString().slice(0,10)}
function monthStart(){return today().slice(0,8)+"01"}
function rate(c){return DB.settings.rates[c]||1}
function toUSD(v,c){return v/ rate(c)}
function fromUSD(v,c){return v* rate(c)}
function nfmt(v,c){
  c=c||"USD"; var dec = (c==="SYP"||c==="TRY")?0:2;
  return Number(v||0).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function money(usd,c){c=c||DB.settings.base;return nfmt(fromUSD(usd,c),c)+" "+c}
function dfmt(s){if(!s)return"—";var d=new Date(s);return d.toLocaleDateString("ar-SY",{day:"2-digit",month:"short",year:"numeric"})}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on")},2200)}
function confirmBox(msg,fn){
  openModal("تأكيد","<p style='font-size:14px'>"+esc(msg)+"</p>",
    [{t:"تأكيد",cls:"btn danger",fn:function(){closeModal();fn()}},{t:"إلغاء",cls:"btn ghost",fn:closeModal}]);
}
function openModal(title,html,btns){
  $("#mtitle").textContent=title; $("#mbody").innerHTML=html;
  var f=$("#mfoot"); f.innerHTML="";
  (btns||[]).forEach(function(b){var el=document.createElement("button");el.className=b.cls||"btn";el.textContent=b.t;el.onclick=b.fn;f.appendChild(el)});
  $("#modal").classList.add("on");
  var first=$("#mbody input,#mbody select"); if(first) setTimeout(function(){first.focus()},40);
}
function closeModal(){$("#modal").classList.remove("on")}
$("#modal").addEventListener("click",function(e){if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
function csv(name,rows){
  var s="\uFEFF"+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv;charset=utf-8"}));a.download=name+".csv";a.click();
}
function prod(id){return DB.products.filter(function(p){return p.id===id})[0]}

/* ===================== accounting core ===================== */
function inRange(d,a,b){return (!a||d>=a)&&(!b||d<=b)}
function salesIn(a,b){return DB.sales.filter(function(s){return inRange(s.date,a,b)})}
function revenue(a,b){return salesIn(a,b).reduce(function(t,s){return t+s.totalUSD},0)}
function cogs(a,b){return salesIn(a,b).reduce(function(t,s){return t+s.items.reduce(function(x,i){return x+i.costUSD*i.qty},0)},0)}
function expensesIn(a,b){return DB.expenses.filter(function(e){return !e.capex && inRange(e.date,a,b)}).reduce(function(t,e){return t+e.amountUSD},0)}
function capexIn(a,b){return DB.expenses.filter(function(e){return e.capex && inRange(e.date,a,b)}).reduce(function(t,e){return t+e.amountUSD},0)}
function stockValue(){return DB.products.reduce(function(t,p){return t+p.stock*p.cost},0)}
function cashBalance(){
  var s=DB.settings.cashOpen||0;
  DB.sales.forEach(function(x){ if(x.method!=="آجل") s+=x.totalUSD });
  DB.purchases.forEach(function(x){ if(x.paid) s-=x.totalUSD });
  DB.expenses.forEach(function(x){ s-=x.amountUSD });
  DB.cashmoves.forEach(function(m){ s+= (m.type==="in"? m.amountUSD : -m.amountUSD) });
  DB.capital.forEach(function(c){ s+= (c.type==="draw"? -c.amountUSD : c.amountUSD) });
  return s;
}
function receivables(){return DB.sales.filter(function(s){return s.method==="آجل" && !s.settled}).reduce(function(t,s){return t+s.totalUSD},0)}
function payables(){return DB.purchases.filter(function(p){return !p.paid}).reduce(function(t,p){return t+p.totalUSD},0)}

/* ===================== nav ===================== */
var ROUTES=[
  {sep:"التشغيل"},
  {id:"dash",t:"لوحة القيادة"},
  {id:"pos",t:"فاتورة جديدة"},
  {id:"sales",t:"المبيعات"},
  {sep:"المخزون والشراء"},
  {id:"stock",t:"المنتجات والمخزون"},
  {id:"purchases",t:"المشتريات"},
  {sep:"المال"},
  {id:"expenses",t:"المصاريف"},
  {id:"cash",t:"الصندوق"},
  {id:"capital",t:"رأس المال والشركاء"},
  {id:"customers",t:"العملاء"},
  {sep:"التقارير"},
  {id:"reports",t:"التقارير المحاسبية"},
  {id:"settings",t:"الإعدادات"}
];
function renderNav(){
  $("#nav").innerHTML=ROUTES.map(function(r){
    if(r.sep) return '<div class="sep">'+r.sep+'</div>';
    return '<a href="#'+r.id+'" data-r="'+r.id+'"><i></i>'+r.t+'</a>';
  }).join("");
}
function route(){
  var id=(location.hash||"#dash").slice(1).split("/")[0];
  if(!VIEWS[id]) id="dash";
  $$("#nav a").forEach(function(a){a.classList.toggle("on",a.dataset.r===id)});
  $("#view").innerHTML=""; VIEWS[id]();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

function head(title,sub,actions){
  return '<div class="head"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+(actions||"")+'</div></div>';
}
function emptyRow(cols,msg){return '<tr><td colspan="'+cols+'"><div class="empty"><div class="mark mark-emb"></div>'+msg+'</div></td></tr>'}

/* ===================== views ===================== */
var VIEWS={};

/* ---------- dashboard ---------- */
VIEWS.dash=function(){
  var t=today(), ms=monthStart(), base=DB.settings.base;
  var dayR=revenue(t,t), monR=revenue(ms,t), monC=cogs(ms,t), monE=expensesIn(ms,t);
  var gross=monR-monC, net=gross-monE;
  var low=DB.products.filter(function(p){return p.active && p.stock<=(p.min||DB.settings.min)});
  var days=[],i;
  for(i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=d.toISOString().slice(0,10);days.push({k:k,v:revenue(k,k),lab:d.getDate()+"/"+(d.getMonth()+1)})}
  var mx=Math.max.apply(null,days.map(function(d){return d.v}).concat([1]));
  var top={};
  salesIn(ms,t).forEach(function(s){s.items.forEach(function(i){top[i.id]=(top[i.id]||0)+i.qty})});
  var tops=Object.keys(top).map(function(k){return{p:prod(k),q:top[k]}}).filter(function(x){return x.p}).sort(function(a,b){return b.q-a.q}).slice(0,6);

  $("#view").innerHTML=
  head("لوحة القيادة","حركة اليوم والشهر الحالي · العملة "+base,
    '<a class="btn" href="#pos">فاتورة جديدة</a><button class="btn ghost" id="pr">طباعة الملخص</button>')+
  '<div class="strip">'+
    '<div><div class="k">مبيعات اليوم</div><div class="v num">'+nfmt(fromUSD(dayR,base),base)+' <small>'+base+'</small></div><div class="d">'+salesIn(t,t).length+' فاتورة</div></div>'+
    '<div><div class="k">مبيعات الشهر</div><div class="v num">'+nfmt(fromUSD(monR,base),base)+' <small>'+base+'</small></div><div class="d">'+salesIn(ms,t).length+' فاتورة</div></div>'+
    '<div><div class="k">مجمل الربح</div><div class="v num '+(gross<0?"down":"")+'">'+nfmt(fromUSD(gross,base),base)+' <small>'+base+'</small></div><div class="d">هامش '+(monR? Math.round(gross/monR*100):0)+'٪</div></div>'+
    '<div><div class="k">صافي الربح</div><div class="v num '+(net<0?"down":"up")+'">'+nfmt(fromUSD(net,base),base)+' <small>'+base+'</small></div><div class="d">بعد مصاريف '+nfmt(fromUSD(monE,base),base)+'</div></div>'+
    '<div><div class="k">رصيد الصندوق</div><div class="v num">'+nfmt(fromUSD(cashBalance(),base),base)+' <small>'+base+'</small></div><div class="d">قيمة المخزون '+nfmt(fromUSD(stockValue(),base),base)+'</div></div>'+
  '</div>'+
  '<div class="cols">'+
    '<div class="panel"><h3>المبيعات · آخر ١٤ يوم</h3><div class="chart-wrap"><div class="chart">'+
      days.map(function(d){return '<div class="bar" style="height:'+Math.max(2,d.v/mx*100)+'%" title="'+d.k+' · '+nfmt(fromUSD(d.v,base),base)+'"><span>'+d.lab+'</span></div>'}).join("")+
    '</div></div></div>'+
    '<div class="panel"><h3>الأكثر مبيعاً هذا الشهر</h3><table><tbody>'+
      (tops.length? tops.map(function(x){return '<tr><td>'+esc(x.p.ar)+' <span class="tag">'+esc(x.p.size)+'</span></td><td class="n">'+x.q+'</td></tr>'}).join("") : emptyRow(2,"لا مبيعات مسجّلة هذا الشهر بعد."))+
    '</tbody></table></div>'+
  '</div>'+
  '<div class="cols">'+
    '<div class="panel"><h3>آخر الفواتير</h3><table><thead><tr><th>الرقم</th><th>العميل</th><th>الدفع</th><th class="n">القيمة</th></tr></thead><tbody>'+
      (DB.sales.length? DB.sales.slice(-6).reverse().map(function(s){
        return '<tr><td class="mono-n">#'+s.no+'</td><td>'+esc(s.customer||"زبون نقدي")+'</td><td><span class="tag">'+esc(s.method)+'</span></td><td class="n">'+nfmt(s.total,s.cur)+' '+s.cur+'</td></tr>'
      }).join("") : emptyRow(4,"لا فواتير بعد. ابدأ من «فاتورة جديدة»."))+
    '</tbody></table></div>'+
    '<div class="panel"><h3>تنبيه المخزون'+(low.length?' <span class="tag low">'+low.length+'</span>':'')+'</h3><table><tbody>'+
      (low.length? low.map(function(p){return '<tr><td>'+esc(p.ar)+' <span class="tag">'+esc(p.size)+'</span></td><td class="n"><span class="tag low">'+p.stock+' متبقّي</span></td></tr>'}).join("") : emptyRow(2,"كل المنتجات ضمن الحد الآمن."))+
    '</tbody></table></div>'+
  '</div>';
  $("#pr").onclick=function(){printSummary(ms,t)};
};

/* ---------- POS ---------- */
var cart=[], posCur=null, posMethod="نقدي", posDisc=0;
VIEWS.pos=function(){
  posCur=posCur||DB.settings.base;
  $("#view").innerHTML=
  head("فاتورة جديدة","اختر المنتجات ثم احفظ الفاتورة","")+
  '<div class="pos"><div><div class="prods">'+
    DB.products.filter(function(p){return p.active}).map(function(p){
      return '<button class="prod" data-p="'+p.id+'" '+(p.stock<=0?"disabled":"")+'>'+
        '<div class="nm">'+esc(p.en)+'</div><div class="ar">'+esc(p.ar)+' · '+esc(p.size)+'</div>'+
        '<div class="pr num">'+nfmt(fromUSD(p.price,posCur),posCur)+'</div>'+
        '<div class="st">'+(p.stock>0? "المخزون "+p.stock : "نفد المخزون")+'</div></button>';
    }).join("")+
  '</div></div>'+
  '<div class="cart"><h3 style="font-weight:600;font-size:14px;padding:14px 16px;border-bottom:1px solid var(--line-soft)">الفاتورة</h3>'+
    '<div class="items" id="items"></div>'+
    '<div style="padding:14px 16px;border-top:1px solid var(--line-soft)" class="grid2">'+
      '<div><label class="f">العملة</label><select id="cur">'+CUR.map(function(c){return '<option '+(c===posCur?"selected":"")+'>'+c+'</option>'}).join("")+'</select></div>'+
      '<div><label class="f">طريقة الدفع</label><select id="meth">'+["نقدي","تحويل","بطاقة","واتساب","آجل"].map(function(m){return '<option '+(m===posMethod?"selected":"")+'>'+m+'</option>'}).join("")+'</select></div>'+
      '<div><label class="f">اسم العميل</label><input id="cust" type="text" placeholder="اختياري"></div>'+
      '<div><label class="f">الهاتف</label><input id="phone" type="text" placeholder="اختياري"></div>'+
      '<div style="grid-column:1/-1"><label class="f">خصم ('+posCur+')</label><input id="disc" type="number" min="0" value="'+posDisc+'"></div>'+
    '</div>'+
    '<div class="sum" id="sum"></div>'+
    '<div style="padding:0 16px 16px;display:flex;gap:8px"><button class="btn" id="save" style="flex:1">حفظ الفاتورة</button><button class="btn ghost" id="clear">تفريغ</button></div>'+
  '</div></div>';

  $$(".prod").forEach(function(b){b.onclick=function(){addItem(b.dataset.p)}});
  $("#cur").onchange=function(){posCur=this.value;VIEWS.pos()};
  $("#meth").onchange=function(){posMethod=this.value};
  $("#disc").oninput=function(){posDisc=+this.value||0;drawCart()};
  $("#clear").onclick=function(){cart=[];posDisc=0;VIEWS.pos()};
  $("#save").onclick=saveSale;
  drawCart();
};
function addItem(id){
  var p=prod(id), c=cart.filter(function(x){return x.id===id})[0];
  if(c){ if(c.qty+1>p.stock){return toast("الكمية المتاحة "+p.stock+" فقط")} c.qty++; }
  else cart.push({id:id,qty:1});
  drawCart();
}
function drawCart(){
  var box=$("#items"); if(!box)return;
  box.innerHTML = cart.length? cart.map(function(c){var p=prod(c.id);
    return '<div class="ci"><div class="nm">'+esc(p.ar)+' <span class="tag">'+esc(p.size)+'</span></div>'+
    '<div class="qty"><button data-m="'+c.id+'">−</button><span>'+c.qty+'</span><button data-p="'+c.id+'">+</button></div>'+
    '<div class="mono-n" style="width:78px;text-align:left">'+nfmt(fromUSD(p.price*c.qty,posCur),posCur)+'</div></div>';
  }).join("") : '<div class="empty" style="padding:34px 16px"><div class="mark mark-emb"></div>اضغط على منتج لإضافته.</div>';
  $$("#items [data-p]").forEach(function(b){b.onclick=function(){addItem(b.dataset.p)}});
  $$("#items [data-m]").forEach(function(b){b.onclick=function(){
    var c=cart.filter(function(x){return x.id===b.dataset.m})[0]; c.qty--; if(c.qty<=0) cart=cart.filter(function(x){return x!==c}); drawCart();
  }});
  var sub=cart.reduce(function(t,c){return t+prod(c.id).price*c.qty},0); // USD
  var subC=fromUSD(sub,posCur), tot=Math.max(0,subC-posDisc);
  $("#sum").innerHTML='<div class="row"><span>المجموع</span><span class="mono-n">'+nfmt(subC,posCur)+'</span></div>'+
    (posDisc? '<div class="row"><span>الخصم</span><span class="mono-n">−'+nfmt(posDisc,posCur)+'</span></div>':'')+
    '<div class="row tot"><span>الإجمالي</span><b class="num">'+nfmt(tot,posCur)+' '+posCur+'</b></div>';
}
function saveSale(){
  if(!cart.length) return toast("الفاتورة فارغة");
  var cur=posCur, sub=cart.reduce(function(t,c){return t+prod(c.id).price*c.qty},0);
  var subC=fromUSD(sub,cur), disc=Math.min(posDisc,subC), tot=subC-disc;
  var s={
    id:uid(), no:DB.settings.invNo++, date:today(), time:new Date().toTimeString().slice(0,5),
    customer:$("#cust").value.trim(), phone:$("#phone").value.trim(),
    cur:cur, rate:rate(cur), method:$("#meth").value, discount:disc, total:tot, totalUSD:toUSD(tot,cur), settled:false,
    items:cart.map(function(c){var p=prod(c.id);return{id:p.id,name:p.ar,en:p.en,size:p.size,qty:c.qty,priceUSD:p.price,costUSD:p.cost,price:fromUSD(p.price,cur)}})
  };
  s.items.forEach(function(i){var p=prod(i.id); p.stock=Math.max(0,p.stock-i.qty)});
  if(s.customer){
    var cu=DB.customers.filter(function(x){return x.name===s.customer})[0];
    if(!cu){cu={id:uid(),name:s.customer,phone:s.phone,total:0,count:0,first:s.date};DB.customers.push(cu)}
    if(s.phone) cu.phone=s.phone; cu.total+=s.totalUSD; cu.count++; cu.last=s.date;
  }
  DB.sales.push(s); save(); cart=[]; posDisc=0;
  toast("تم حفظ الفاتورة #"+s.no);
  invoice(s); VIEWS.pos();
}

/* ---------- sales ---------- */
var sf={from:"",to:"",q:""};
VIEWS.sales=function(){
  var rows=DB.sales.filter(function(s){
    return inRange(s.date,sf.from,sf.to) && (!sf.q || (s.customer||"").indexOf(sf.q)>-1 || String(s.no).indexOf(sf.q)>-1);
  }).slice().reverse();
  var tot=rows.reduce(function(t,s){return t+s.totalUSD},0);
  $("#view").innerHTML=

/* ---------- cash ---------- */
VIEWS.cash=function(){
  var base=DB.settings.base;
  var led=[];
  DB.sales.forEach(function(s){if(s.method!=="آجل"||s.settled) led.push({d:s.date,t:"مبيعات · فاتورة #"+s.no,v:s.totalUSD})});
  DB.purchases.forEach(function(p){if(p.paid) led.push({d:p.date,t:"توريد · "+p.name,v:-p.totalUSD})});
  DB.expenses.forEach(function(e){led.push({d:e.date,t:"مصروف · "+e.cat+(e.note?" · "+e.note:""),v:-e.amountUSD})});
  DB.cashmoves.forEach(function(m){led.push({d:m.date,t:(m.type==="in"?"إيداع · ":"سحب · ")+(m.note||""),v:m.type==="in"?m.amountUSD:-m.amountUSD})});
  led.sort(function(a,b){return a.d<b.d?1:-1});
  var inSum=led.filter(function(x){return x.v>0}).reduce(function(t,x){return t+x.v},0);
  var outSum=-led.filter(function(x){return x.v<0}).reduce(function(t,x){return t+x.v},0);

  $("#view").innerHTML=
  head("الصندوق","حركة الداخل والخارج · العملة "+base,'<button class="btn ghost" id="mv">حركة يدوية</button>')+
  '<div class="strip" style="grid-template-columns:repeat(4,1fr)">'+
    '<div><div class="k">الرصيد الحالي</div><div class="v num">'+nfmt(fromUSD(cashBalance(),base),base)+' <small>'+base+'</small></div><div class="d">رصيد افتتاحي '+nfmt(fromUSD(DB.settings.cashOpen,base),base)+'</div></div>'+
    '<div><div class="k">إجمالي الداخل</div><div class="v num up">'+nfmt(fromUSD(inSum,base),base)+'</div></div>'+
    '<div><div class="k">إجمالي الخارج</div><div class="v num down">'+nfmt(fromUSD(outSum,base),base)+'</div></div>'+
    '<div><div class="k">ذمم العملاء (آجل)</div><div class="v num">'+nfmt(fromUSD(receivables(),base),base)+'</div><div class="d">مستحق للموردين '+nfmt(fromUSD(payables(),base),base)+'</div></div>'+
  '</div>'+
  '<div class="panel"><h3>دفتر الحركة</h3><table><thead><tr><th>التاريخ</th><th>البيان</th><th class="n">داخل</th><th class="n">خارج</th></tr></thead><tbody>'+
    (led.length? led.slice(0,80).map(function(x){
      return '<tr><td>'+dfmt(x.d)+'</td><td>'+esc(x.t)+'</td><td class="n up">'+(x.v>0?nfmt(fromUSD(x.v,base),base):"—")+'</td><td class="n down">'+(x.v<0?nfmt(fromUSD(-x.v,base),base):"—")+'</td></tr>';
    }).join("") : emptyRow(4,"لا حركة على الصندوق بعد."))+
  '</tbody></table></div>';
  $("#mv").onclick=function(){
    openModal("حركة صندوق يدوية",
      '<div class="grid2"><div><label class="f">النوع</label><select id="c_t"><option value="in">إيداع</option><option value="out">سحب</option></select></div>'+
      '<div><label class="f">التاريخ</label><input id="c_d" type="date" value="'+today()+'"></div>'+
      '<div><label class="f">العملة</label><select id="c_c">'+CUR.map(function(c){return '<option '+(c===base?"selected":"")+'>'+c+'</option>'}).join("")+'</select></div>'+
      '<div><label class="f">المبلغ</label><input id="c_a" type="number" step="0.01" value="0"></div>'+
      '<div style="grid-column:1/-1"><label class="f">البيان</label><input id="c_n" placeholder="مثال: سحب شخصي، إيداع رأس مال"></div></div>',
      [{t:"حفظ",fn:function(){
        var a=+$("#c_a").value||0, cur=$("#c_c").value; if(a<=0) return toast("أدخل مبلغاً صحيحاً");
        DB.cashmoves.push({id:uid(),date:$("#c_d").value,type:$("#c_t").value,cur:cur,amount:a,amountUSD:toUSD(a,cur),note:$("#c_n").value.trim()});
        save(); closeModal(); VIEWS.cash();
      }},{t:"إلغاء",cls:"btn ghost",fn:closeModal}]);
  };
};


/* ---------- capital & partners ---------- */
VIEWS.capital=function(){
  var base=DB.settings.base;
  var rows=DB.capital.slice().sort(function(a,b){return a.date<b.date?1:-1});
  var by={};
  DB.capital.forEach(function(c){ by[c.partner]=(by[c.partner]||0)+(c.type==="draw"?-c.amountUSD:c.amountUSD) });
  var names=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  var totIn=DB.capital.filter(function(c){return c.type!=="draw"}).reduce(function(t,c){return t+c.amountUSD},0);
  var totDraw=DB.capital.filter(function(c){return c.type==="draw"}).reduce(function(t,c){return t+c.amountUSD},0);
  var net=revenue("","")-cogs("","")-expensesIn("","");

var rf={from:monthStart(),to:today()};
VIEWS.reports=function(){

    var o=byP[i.id]=byP[i.id]||{q:0,r:0,c:0,name:i.name+" · "+i.size};
    o.q+=i.qty; o.r+=i.priceUSD*i.qty; o.c+=i.costUSD*i.qty;
  })});
  var prods=Object.keys(byP).map(function(k){return byP[k]}).sort(function(x,y){return y.r-x.r});

  head("التقارير المحاسبية","بيان الأرباح والخسائر وتحليل المبيعات",'<button class="btn ghost" id="pr">طباعة</button><button class="btn ghost" id="ex">تصدير CSV</button>')+

    '<div style="display:flex;gap:8px;align-items:flex-end"><button class="btn ghost sm" data-q="m">هذا الشهر</button><button class="btn ghost sm" data-q="y">هذه السنة</button><button class="btn ghost sm" data-q="a">كل الفترات</button></div>'+
  '</div></div>'+
  '<div class="cols">'+
    '<div class="panel"><h3>بيان الأرباح والخسائر</h3><table><tbody>'+
      '<tr><td>إيرادات المبيعات</td><td class="n">'+f(R)+'</td></tr>'+
      '<tr><td>تكلفة البضاعة المباعة</td><td class="n down">−'+f(C)+'</td></tr>'+
      '<tr style="background:#fbfaf5"><td><b>مجمل الربح</b></td><td class="n"><b>'+f(G)+'</b> <span class="tag">'+(R?Math.round(G/R*100):0)+'٪</span></td></tr>'+
      '<tr><td>المصاريف التشغيلية</td><td class="n down">−'+f(E)+'</td></tr>'+
      '<tr style="background:#f4f6ee"><td><b>صافي الربح</b></td><td class="n"><b class="'+(N<0?"down":"up")+'">'+f(N)+'</b> <span class="tag">'+(R?Math.round(N/R*100):0)+'٪</span></td></tr>'+
      '<tr><td style="color:var(--ink-60)">مصاريف تأسيسية وأصول (خارج الحساب)</td><td class="n" style="color:var(--ink-60)">'+f(capexIn(a,b))+'</td></tr>'+
      '<tr><td style="color:var(--ink-60)">عدد الفواتير · متوسط الفاتورة</td><td class="n">'+salesIn(a,b).length+' · '+f(salesIn(a,b).length? R/salesIn(a,b).length:0)+'</td></tr>'+
    '</tbody></table></div>'+
    '<div class="panel"><h3>المصاريف حسب البند</h3><table><tbody>'+
      (Object.keys(byCat).length? Object.keys(byCat).sort(function(x,y){return byCat[y]-byCat[x]}).map(function(c){
        return '<tr><td>'+esc(c)+'</td><td class="n">'+f(byCat[c])+'</td><td class="n" style="color:var(--ink-60)">'+(E?Math.round(byCat[c]/E*100):0)+'٪</td></tr>'}).join("") : emptyRow(3,"لا مصاريف في هذه الفترة."))+
    '</tbody></table></div>'+
  '</div>'+
  '<div class="panel"><h3>المبيعات حسب المنتج</h3><table><thead><tr><th>المنتج</th><th class="n">الكمية</th><th class="n">الإيراد</th><th class="n">التكلفة</th><th class="n">مجمل الربح</th><th class="n">الهامش</th></tr></thead><tbody>'+
    (prods.length? prods.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td class="n">'+p.q+'</td><td class="n">'+f(p.r)+'</td><td class="n">'+f(p.c)+'</td><td class="n">'+f(p.r-p.c)+'</td><td class="n">'+(p.r?Math.round((p.r-p.c)/p.r*100):0)+'٪</td></tr>'}).join("") : emptyRow(6,"لا مبيعات في هذه الفترة."))+
  '</tbody></table></div>'+
  '<div class="panel"><h3>المبيعات الشهرية</h3><table><tbody>'+
    (months.length? months.map(function(m){return '<tr><td>'+m+'</td><td class="n">'+f(byMonth[m])+'</td></tr>'}).join("") : emptyRow(2,"لا بيانات."))+
  '</tbody></table></div>';

  $("#r1").onchange=function(){rf.from=this.value;VIEWS.reports()};
  $("#r2").onchange=function(){rf.to=this.value;VIEWS.reports()};

    if(q==="y"){rf.from=today().slice(0,4)+"-01-01";rf.to=today()}

      .concat(prods.map(function(p){return [p.name,p.q,p.r.toFixed(2),p.c.toFixed(2),(p.r-p.c).toFixed(2)]})));
  };
  $("#pr").onclick=function(){printSummary(a,b)};
};

function printSummary(a,b){
  var base=DB.settings.base, R=revenue(a,b), C=cogs(a,b), E=expensesIn(a,b), G=R-C, N=G-E;
  function f(v){return nfmt(fromUSD(v,base),base)+" "+base}

    '<table><tbody>'+
    '<tr><td>إيرادات المبيعات</td><td style="text-align:left">'+f(R)+'</td></tr>'+
    '<tr><td>تكلفة البضاعة المباعة</td><td style="text-align:left">−'+f(C)+'</td></tr>'+
    '<tr><td><b>مجمل الربح</b></td><td style="text-align:left"><b>'+f(G)+'</b></td></tr>'+
    '<tr><td>المصاريف التشغيلية</td><td style="text-align:left">−'+f(E)+'</td></tr>'+
    '<tr><td><b>صافي الربح</b></td><td style="text-align:left"><b>'+f(N)+'</b></td></tr>'+
    '<tr><td>عدد الفواتير</td><td style="text-align:left">'+salesIn(a,b).length+'</td></tr>'+
    '<tr><td>رصيد الصندوق</td><td style="text-align:left">'+f(cashBalance())+'</td></tr>'+
    '<tr><td>قيمة المخزون</td><td style="text-align:left">'+f(stockValue())+'</td></tr>'+
    '</tbody></table><div class="note">'+esc(DB.settings.footer)+'</div></div>';
  window.print();
}

/* ===================== gate ===================== */
function unlock(){
  var v=$("#pin").value;
  if(v===DB.settings.pin){ sessionStorage_set(); $("#gate").style.display="none"; $("#app").classList.add("on"); route(); }
  else { $("#pinerr").textContent="رمز غير صحيح"; $("#pin").value=""; $("#pin").focus(); }
}
function sessionStorage_set(){try{sessionStorage.setItem("lantana_open","1")}catch(e){}}
function sessionOpen(){try{return sessionStorage.getItem("lantana_open")==="1"}catch(e){return false}}
$("#pinbtn").onclick=unlock;
$("#pin").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()});
$("#lock").onclick=function(){try{sessionStorage.removeItem("lantana_open")}catch(e){} $("#app").classList.remove("on"); $("#gate").style.display="grid"; $("#pin").value=""; $("#pin").focus()};

/* ===================== boot ===================== */
if(EMBED) document.body.classList.add("embed");
renderNav();
$("#today").textContent=new Date().toLocaleDateString("ar-SY",{weekday:"long",day:"numeric",month:"long"});
if(EMBED||sessionOpen()){ $("#gate").style.display="none"; $("#app").classList.add("on"); route(); }
else { $("#pin").focus(); }
save();
})();
</script>
</body>
</html>
