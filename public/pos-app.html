/* ── gate ── */
#gate{position:fixed;inset:0;background:var(--olive);display:grid;place-items:center;z-index:100;padding:24px}
#gate .box{width:min(320px,88vw);text-align:center}
#gate .mark-lock{width:190px;height:134px;background:var(--ivory);margin:0 auto 34px;opacity:.95}
#gate input{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(241,238,232,.35);color:var(--ivory);
  text-align:center;letter-spacing:.7em;padding:12px 0;font-size:24px;outline:none}
#gate input:focus{border-color:#DFCDA8}
#gate label{display:block;color:rgba(241,238,232,.62);font-size:13px;margin-bottom:14px}
#gate button{margin-top:26px;color:var(--olive);background:var(--ivory);padding:13px 42px;border-radius:40px;font-weight:600}
#gate .err{color:#DFCDA8;font-size:13px;height:20px;margin-top:16px}

/* ── shell ── */
#app{display:none;min-height:100%;flex-direction:column}
#app.on{display:flex}
header{background:var(--olive);color:var(--ivory);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:30}
header .mark-lock{width:92px;height:65px;background:var(--ivory);opacity:.94}
header .rt{display:flex;align-items:center;gap:16px;font-size:12.5px;color:rgba(241,238,232,.72)}
header button{color:rgba(241,238,232,.9);font-size:12.5px;border:1px solid rgba(241,238,232,.3);padding:6px 14px;border-radius:30px}
main{flex:1;padding:16px 20px 24px;display:grid;grid-template-columns:1fr 350px;gap:20px;align-items:start;max-width:1280px;margin:0 auto;width:100%}

/* ── search ── */
.search{position:relative;margin-bottom:14px}
.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:40px;padding:13px 46px 13px 18px;outline:none;font-size:15px}
.search input:focus{border-color:var(--olive-mid)}
.search svg{position:absolute;right:17px;top:50%;transform:translateY(-50%);opacity:.4}

/* ── product grid ── */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:center;position:relative;
  transition:transform .1s, box-shadow .15s, border-color .15s;display:flex;flex-direction:column}
.prod:hover{border-color:var(--olive-mid);box-shadow:0 8px 22px -14px rgba(42,44,34,.5)}
.prod:active{transform:scale(.97)}
.prod .ph{background:#fff;padding:10px 8px 4px}
.prod img{width:100%;height:108px;object-fit:contain;display:block}
.prod .meta{padding:8px 10px 13px}
.prod .nm{font-size:14.5px;font-weight:600;letter-spacing:.02em;line-height:1.3}
.prod .ar{font-size:12px;color:var(--ink-60);margin-top:1px}
.prod .pr{margin-top:7px;font-size:20px;color:var(--olive);font-weight:600;font-family:'Cairo',sans-serif}
.stk{position:absolute;top:9px;right:9px;background:rgba(241,238,232,.94);border:1px solid var(--line);color:var(--ink-60);
  font-size:11.5px;padding:1px 9px;border-radius:20px;font-variant-numeric:tabular-nums}
.stk.low{background:#faf0ee;color:var(--minus);border-color:#eeddd9}
.prod:disabled{opacity:.42}
.prod:disabled .ph{filter:grayscale(1)}

/* ── cart ── */
.cart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:82px;overflow:hidden}
.cart h2{font-size:14.5px;font-weight:600;padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.cart h2 button{font-size:12px;color:var(--ink-60);font-weight:400}
.items{max-height:32vh;overflow:auto}
.ci{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line-soft)}
.ci img{width:36px;height:36px;object-fit:contain;background:#fff;border-radius:6px;flex:none}
.ci .nm{flex:1;font-size:13.5px;line-height:1.35}
.ci .nm small{display:block;color:var(--ink-60);font-size:11.5px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:30px;background:#fff;flex:none}
.qty button{width:32px;height:32px;line-height:1;color:var(--olive);font-size:17px;font-weight:600}
.qty span{width:26px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.empty{padding:38px 18px;text-align:center;color:var(--ink-60);font-size:13.5px}
.empty .mark-emb{width:34px;height:42px;background:var(--line);margin:0 auto 12px}

.fields{padding:14px 16px 4px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:block;font-size:11.5px;color:var(--ink-60);margin-bottom:5px}
input[type=text],input[type=number],select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--olive-mid)}
.more{padding:2px 16px 12px}
.more button{font-size:12.5px;color:var(--olive);text-decoration:underline;text-underline-offset:3px}
#extra{display:none;grid-template-columns:1fr 1fr;gap:12px;padding:8px 0 0}
#extra.on{display:grid}

.sum{padding:14px 18px;border-top:1px solid var(--line-soft);background:var(--ivory)}
.sum .row{display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0;color:var(--ink-60)}
.sum .row.tot{color:var(--ink);align-items:center;padding-top:10px;margin-top:8px;border-top:1px solid var(--line)}
.sum .row.tot b{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.acts{padding:14px 16px;display:flex;gap:10px}
.btn{background:var(--olive);color:var(--ivory);padding:15px 18px;border-radius:11px;font-size:15.5px;font-weight:600;flex:1}
.btn:hover{background:#5d6146}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--ink-60);border:1px solid var(--line);flex:none;padding:15px 16px}

/* ── shift ── */
.shift{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.shift h2{font-size:14.5px;font-weight:600;padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between}
.shift h2 span:last-child{color:var(--olive);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
td{padding:12px 18px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
tr:last-child td{border-bottom:0}
td.n{text-align:left;font-variant-numeric:tabular-nums}
.mini{font-size:12.5px;color:var(--ink-60);border:1px solid var(--line);padding:5px 12px;border-radius:20px}

#toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--ivory);padding:13px 22px;border-radius:11px;
  font-size:14px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:90}
#toast.on{opacity:1;transform:none}
#sync{position:fixed;bottom:22px;left:22px;font-size:11.5px;color:var(--ink-60);background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:5px 14px;z-index:40;display:flex;align-items:center;gap:7px}
#sync i{width:6px;height:6px;border-radius:50%;background:var(--sage);flex:none}
#sync.bad i{background:var(--minus)}

/* ── receipt ── */
#print{display:none}
@media print{
  body{background:#fff}
  #app,#gate,#toast,#sync{display:none!important}
  #print{display:block}
  @page{size:A5;margin:14mm}
}
#print .ivhead{text-align:center;border-bottom:1px solid #DCD8CB;padding-bottom:14px;margin-bottom:16px}
#print .ivhead .mark-lock{width:150px;height:106px;background:#6F7354;margin:0 auto 8px}
#print table{width:100%;border-collapse:collapse;margin:12px 0}
#print th{font-size:11px;border-bottom:1px solid #2A2C22;padding:6px 4px}
#print td{padding:7px 4px;border-bottom:1px solid #E8E4D9;font-size:12px}
#print .tot{display:flex;justify-content:space-between;font-size:15px;padding-top:10px;margin-top:6px;border-top:1px solid #2A2C22}
#print .note{text-align:center;font-size:10.5px;color:#5E6153;margin-top:22px;line-height:1.9}

@media(max-width:920px){
  main{grid-template-columns:1fr;padding:14px;gap:14px}
  .prods{grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:10px}
  .prod img{height:96px}
  .cart{position:static;order:-1}
  .items{max-height:none}
  header .mark-lock{width:76px;height:54px}
  #sync{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--olive-mid);outline-offset:2px}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="mark mark-lock"></div>
    <label for="pin">رمز الدخول</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <div class="err" id="pinerr"></div>
    <button id="pinbtn">دخول</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="mark mark-lock"></div>
    <div class="rt"><span id="today"></span><button id="lock">إنهاء</button></div>
  </header>
  <main>

var API="/api/pos", TOKEN="", CAT=null, cart=[], shift=[], filter="";
var METHODS=["نقدي","تحويل","بطاقة","واتساب","آجل"];

var $=function(s){return document.querySelector(s)}, $$=function(s){return [].slice.call(document.querySelectorAll(s))};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function rate(c){return (CAT&&CAT.rates[c])||1}
function fromUSD(v,c){return v*rate(c)}
function nfmt(v,c){var d=(c==="SYP"||c==="TRY")?0:2;return Number(v||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on")},2400)}
function setSync(bad,txt){var el=$("#sync");el.className=bad?"bad":"";el.querySelector("span").textContent=txt}
function prod(id){return CAT.products.filter(function(p){return p.id===id})[0]}
function cur(){return $("#cur").value}
function img(id){return IMG[id]? 'data:image/webp;base64,'+IMG[id] : ''}

/* ── gate ── */
function unlock(){
  var v=$("#pin").value; if(!v) return;
  $("#pinerr").textContent="جاري التحقق…";
  fetch(API+"?pin="+encodeURIComponent(v),{cache:"no-store"}).then(function(r){
    if(r.status===401){ $("#pinerr").textContent="رمز غير صحيح"; $("#pin").value=""; $("#pin").focus(); return null }
    if(!r.ok) throw 0; return r.json();
  }).then(function(d){
    if(!d) return;
    TOKEN=v; CAT=d;
    try{sessionStorage.setItem("lantana_pos_pin",v)}catch(e){}
    open_();
  }).catch(function(){ $("#pinerr").textContent="تعذّر الاتصال — تحقّق من الإنترنت" });
}
$("#pinbtn").onclick=unlock;
$("#pin").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()});
$("#lock").onclick=function(){
  try{sessionStorage.removeItem("lantana_pos_pin")}catch(e){}
  TOKEN="";cart=[];$("#app").classList.remove("on");$("#gate").style.display="grid";$("#pin").value="";$("#pinerr").textContent="";
};

function open_(){
  $("#gate").style.display="none"; $("#app").classList.add("on");
  $("#today").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  $("#cur").innerHTML=Object.keys(CAT.rates).map(function(c){return '<option '+(c===CAT.base?"selected":"")+'>'+c+'</option>'}).join("");
  $("#meth").innerHTML=METHODS.map(function(m){return '<option>'+m+'</option>'}).join("");
  shift=CAT.today||[];
  setSync(false,"متصل");
  drawProds(); drawCart(); drawShift();
}

/* ── grid ── */
function drawProds(){
  var c=cur(), q=filter.trim().toLowerCase();
  var list=CAT.products.filter(function(p){
    if(!q) return true;
    return (p.en+" "+p.ar+" "+p.size).toLowerCase().indexOf(q)>-1;
  });
  $("#prods").innerHTML = list.length? list.map(function(p){
    return '<button class="prod" data-p="'+p.id+'" '+(p.stock<=0?"disabled":"")+'>'+
      '<span class="stk'+(p.stock<=12?" low":"")+'">'+p.stock+'</span>'+
      '<div class="ph"><img src="'+img(p.id)+'" alt=""></div>'+
      '<div class="meta"><div class="nm">'+esc(p.en)+'</div><div class="ar">'+esc(p.ar)+' · '+esc(p.size)+'</div>'+
      '<div class="pr">'+nfmt(fromUSD(p.price,c),c)+'</div></div></button>';
  }).join("") : '<div class="empty" style="grid-column:1/-1"><div class="mark mark-emb"></div>ما في نتيجة لهذا البحث.</div>';
  $$("#prods .prod").forEach(function(b){b.onclick=function(){addItem(b.dataset.p)}});
}
$("#q").oninput=function(){filter=this.value;drawProds()};
$("#cur").onchange=function(){drawProds();drawCart()};
$("#disc").oninput=drawCart;
$("#clear").onclick=function(){cart=[];$("#disc").value=0;drawCart()};
$("#togg").onclick=function(){$("#extra").classList.toggle("on")};

function addItem(id){
  var p=prod(id), x=cart.filter(function(y){return y.id===id})[0];
  if(x){ if(x.qty+1>p.stock) return toast("المتاح "+p.stock+" فقط"); x.qty++ }
  else cart.push({id:id,qty:1});
  drawCart();
}
function drawCart(){
  var c=cur();
  $("#items").innerHTML = cart.length? cart.map(function(x){var p=prod(x.id);
    return '<div class="ci"><img src="'+img(p.id)+'" alt="">'+
      '<div class="nm">'+esc(p.en)+'<small>'+esc(p.ar)+' · '+esc(p.size)+'</small></div>'+
      '<div class="qty"><button data-m="'+x.id+'">−</button><span>'+x.qty+'</span><button data-a="'+x.id+'">+</button></div>'+
      '<div class="mono-n" style="width:74px;text-align:left;font-size:13.5px">'+nfmt(fromUSD(p.price*x.qty,c),c)+'</div></div>';
  }).join("") : '<div class="empty"><div class="mark mark-emb"></div>اضغط على عطر لإضافته.</div>';
  $$("#items [data-a]").forEach(function(b){b.onclick=function(){addItem(b.dataset.a)}});
  $$("#items [data-m]").forEach(function(b){b.onclick=function(){
    var x=cart.filter(function(y){return y.id===b.dataset.m})[0]; x.qty--;
    if(x.qty<=0) cart=cart.filter(function(y){return y!==x}); drawCart();
  }});
  var subUSD=cart.reduce(function(t,x){return t+prod(x.id).price*x.qty},0);
  var sub=fromUSD(subUSD,c), disc=Math.min(+$("#disc").value||0,sub), tot=sub-disc;
  $("#sum").innerHTML='<div class="row"><span>المجموع</span><span class="mono-n">'+nfmt(sub,c)+'</span></div>'+
    (disc? '<div class="row"><span>الخصم</span><span class="mono-n">−'+nfmt(disc,c)+'</span></div>':'')+
    '<div class="row tot"><span>الإجمالي</span><b>'+nfmt(tot,c)+' <span style="font-size:15px;font-weight:400">'+c+'</span></b></div>';
  $("#save").disabled = !cart.length;
}

/* ── save ── */
$("#save").onclick=function(){
  if(!cart.length) return;
  var c=cur();
  var subUSD=cart.reduce(function(t,x){return t+prod(x.id).price*x.qty},0);
  var sub=fromUSD(subUSD,c), disc=Math.min(+$("#disc").value||0,sub);
  $("#save").disabled=true; setSync(false,"جاري الحفظ…");
  fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({
    pin:TOKEN, cur:c, method:$("#meth").value, discount:disc,
    customer:$("#cust").value.trim(), phone:$("#phone").value.trim(),
    items:cart.map(function(x){return {id:x.id,qty:x.qty}})
  })})
  .then(function(r){ if(r.status===401) throw new Error("auth"); return r.json() })
  .then(function(d){
    if(!d||!d.sale) throw new Error("bad");
    CAT.products=d.products; shift.unshift(d.sale);
    receipt(d.sale);
    cart=[]; $("#disc").value=0; $("#cust").value=""; $("#phone").value=""; $("#extra").classList.remove("on");
    drawProds(); drawCart(); drawShift();
    setSync(false,"محفوظ"); toast("تم حفظ الفاتورة "+d.sale.no);
  })
  .catch(function(e){
    $("#save").disabled=false;
    if(e&&e.message==="auth"){ setSync(true,"انتهت الجلسة"); toast("انتهت الجلسة — أعد الدخول") }
    else { setSync(true,"لم يُحفظ"); toast("لم تُحفظ الفاتورة — أعد المحاولة") }
  });
};

function drawShift(){
  var t={}; shift.forEach(function(s){t[s.cur]=(t[s.cur]||0)+s.total});
  $("#shifttot").textContent=Object.keys(t).map(function(c){return nfmt(t[c],c)+" "+c}).join(" · ")||"—";
  $("#shift").innerHTML = shift.length? shift.map(function(s){
    return '<tr><td class="mono-n">'+esc(s.no)+'</td>'+
      '<td style="color:var(--ink-60);font-size:12.5px">'+s.items.map(function(i){return esc(i.name)+"×"+i.qty}).join("، ")+'</td>'+
      '<td class="n">'+nfmt(s.total,s.cur)+' '+s.cur+'</td>'+
      '<td class="n"><button class="mini" data-r="'+esc(s.id)+'">طباعة</button></td></tr>';
  }).join("") : '<tr><td colspan="4"><div class="empty"><div class="mark mark-emb"></div>لا فواتير اليوم بعد.</div></td></tr>';
  $$("#shift [data-r]").forEach(function(b){b.onclick=function(){
    receipt(shift.filter(function(s){return s.id===b.dataset.r})[0]);
  }});
}

function receipt(s){
  $("#print").innerHTML='<div class="ivhead"><div class="mark mark-lock"></div>'+
    '<div style="font-size:11px;color:#5E6153">'+esc(CAT.branch||"")+'</div>'+
    '<div style="font-size:13px;margin-top:6px">فاتورة مبيع · '+esc(s.no)+'</div></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:#5E6153">'+
      '<span>'+new Date(s.date).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})+' · '+esc(s.time)+'</span>'+
      '<span>'+esc(s.customer||"زبون نقدي")+'</span></div>'+
    '<table><thead><tr><th style="text-align:right">الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>'+
      s.items.map(function(i){return '<tr><td>'+esc(i.name)+' · '+esc(i.size)+'</td><td style="text-align:center">'+i.qty+'</td>'+
        '<td style="text-align:left">'+nfmt(i.price,s.cur)+'</td><td style="text-align:left">'+nfmt(i.price*i.qty,s.cur)+'</td></tr>'}).join("")+
    '</tbody></table>'+
    (s.discount? '<div style="display:flex;justify-content:space-between;font-size:12px"><span>الخصم</span><span>−'+nfmt(s.discount,s.cur)+'</span></div>':'')+
    '<div class="tot"><span>الإجمالي · '+esc(s.method)+'</span><span>'+nfmt(s.total,s.cur)+' '+s.cur+'</span></div>'+
    '<div class="note">'+esc(CAT.footer||"")+'<br>LANTANA · لانتانا</div>';
  window.print();
}

setSync(false,"");
var saved=null; try{saved=sessionStorage.getItem("lantana_pos_pin")}catch(e){}
if(saved){ $("#pin").value=saved; unlock() } else { $("#pin").focus() }
})();
</script>
</body>
