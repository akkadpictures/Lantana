/* ── gate ── */
#gate{position:fixed;inset:0;background:var(--olive);display:grid;place-items:center;z-index:100;padding:24px}
#gate .box{width:min(320px,88vw);text-align:center}
#gate .mark-lock{width:190px;height:134px;background:var(--ivory);margin:0 auto 32px;opacity:.95}
#gate input{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(241,238,232,.35);color:var(--ivory);
  text-align:center;letter-spacing:.7em;padding:10px 0 12px;font-size:22px;outline:none}
#gate input:focus{border-color:var(--beige)}
#gate label{display:block;color:rgba(241,238,232,.62);font-size:13px;margin-bottom:16px}
#gate button{margin-top:24px;color:var(--olive);background:var(--ivory);padding:12px 38px;border-radius:var(--r);font-weight:600}
#gate .err{color:var(--beige);font-size:13px;height:20px;margin-top:14px}

/* ── shell ── */
#app{display:none}
#app.on{display:block}
header{background:var(--olive);color:var(--ivory);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:20}
header .mark-lock{width:96px;height:68px;background:var(--ivory);opacity:.92}
header .rt{display:flex;align-items:center;gap:14px;font-size:12.5px;color:rgba(241,238,232,.7)}
header button{color:rgba(241,238,232,.85);font-size:12.5px;border:1px solid rgba(241,238,232,.28);padding:5px 12px;border-radius:20px}
main{padding:18px;display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;max-width:1200px;margin:0 auto}

.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.prod{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 14px;text-align:right}
.prod:active{border-color:var(--olive)}
.prod .nm{font-size:14.5px;font-weight:600;letter-spacing:.02em}
.prod .ar{font-size:12.5px;color:var(--ink-60)}
.prod .pr{margin-top:9px;font-size:21px}
.prod .st{font-size:11.5px;color:var(--ink-60)}
.prod:disabled{opacity:.4}

.cart{background:#fff;border:1px solid var(--line);border-radius:var(--r);position:sticky;top:86px}
.cart h2{font-size:14px;font-weight:600;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.items{max-height:34vh;overflow:auto}
.ci{display:flex;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-soft)}
.ci .nm{flex:1;font-size:13.5px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r)}
.qty button{width:30px;height:30px;line-height:1;color:var(--ink-60);font-size:16px}
.qty span{width:28px;text-align:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.fields{padding:14px 16px;border-top:1px solid var(--line-soft);display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:block;font-size:12px;color:var(--ink-60);margin-bottom:5px}
input[type=text],input[type=number],select{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--olive-mid)}
.sum{padding:14px 16px;border-top:1px solid var(--line)}
.sum .row{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--ink-60)}
.sum .row.tot{color:var(--ink);font-size:15px;padding-top:9px;margin-top:7px;border-top:1px solid var(--line-soft)}
.sum .row.tot b{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:500}
.acts{padding:0 16px 16px;display:flex;gap:8px}
.btn{background:var(--olive);color:var(--ivory);padding:12px 18px;border-radius:var(--r);font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--olive);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12.5px;font-weight:400}
.btn:disabled{opacity:.5}

.shift{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.shift h2{font-size:14px;font-weight:600;padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse}
td{padding:11px 16px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
tr:last-child td{border-bottom:0}
td.n{text-align:left;font-variant-numeric:tabular-nums}
.empty{padding:34px 16px;text-align:center;color:var(--ink-60);font-size:13.5px}
.empty .mark-emb{width:32px;height:39px;background:var(--line);margin:0 auto 12px}

#toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--ivory);padding:12px 20px;border-radius:var(--r);
  font-size:13.5px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:90}
#toast.on{opacity:1;transform:none}
#sync{position:fixed;bottom:22px;left:22px;font-size:11.5px;color:var(--ink-60);background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:4px 13px;z-index:40;display:flex;align-items:center;gap:7px}
#sync i{width:6px;height:6px;border-radius:50%;background:var(--sage);flex:none}
#sync.bad i{background:var(--minus)}

/* ── printed receipt ── */
#print{display:none}
@media print{
  body{background:#fff}
  #app,#gate,#toast,#sync{display:none!important}
  #print{display:block}
  @page{size:A5;margin:14mm}
}
#print .ivhead{text-align:center;border-bottom:1px solid #DCD8CB;padding-bottom:14px;margin-bottom:16px}
#print .ivhead .mark-lock{width:150px;height:106px;background:#6F7354;margin:0 auto 8px}
#print table{width:100%;border-collapse:collapse;margin:12px 0}
#print th{font-size:11px;border-bottom:1px solid #2A2C22;padding:6px 4px}
#print td{padding:7px 4px;border-bottom:1px solid #E8E4D9;font-size:12px}
#print .tot{display:flex;justify-content:space-between;font-size:15px;padding-top:10px;margin-top:6px;border-top:1px solid #2A2C22}
#print .note{text-align:center;font-size:10.5px;color:#5E6153;margin-top:22px;line-height:1.9}

@media(max-width:900px){
  main{grid-template-columns:1fr;padding:14px}
  .cart{position:static}
  header .mark-lock{width:78px;height:55px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--olive-mid);outline-offset:2px}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="mark mark-lock"></div>
    <label for="pin">رمز الدخول</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <div class="err" id="pinerr"></div>
    <button id="pinbtn">دخول</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="mark mark-lock"></div>
    <div class="rt"><span id="today"></span><button id="lock">إنهاء</button></div>
  </header>
  <main>
    <div>
      <div class="prods" id="prods"></div>
      <div class="shift">
        <h2><span>فواتير اليوم</span><span id="shifttot" class="mono-n"></span></h2>
        <table><tbody id="shift"></tbody></table>
      </div>
    </div>
    <div class="cart">
      <h2>الفاتورة</h2>
      <div class="items" id="items"></div>
      <div class="fields">
        <div><label class="f">العملة</label><select id="cur"></select></div>
        <div><label class="f">طريقة الدفع</label><select id="meth"></select></div>
        <div><label class="f">اسم الزبون</label><input id="cust" type="text" placeholder="اختياري"></div>
        <div><label class="f">الهاتف</label><input id="phone" type="text" placeholder="اختياري"></div>
        <div style="grid-column:1/-1"><label class="f">خصم</label><input id="disc" type="number" min="0" value="0"></div>
      </div>
      <div class="sum" id="sum"></div>
      <div class="acts"><button class="btn" id="save" style="flex:1">حفظ وطباعة</button><button class="btn ghost" id="clear">تفريغ</button></div>
    </div>
  </main>
</div>

<div id="sync"><i></i><span></span></div>
<div id="toast"></div>
<div id="print"></div>

<script>
(function(){
"use strict";
/* Staff terminal. It never receives cost, margin, capital or expense data — the
   API hands over selling prices and stock only, and posts back one sale at a
   time. Nothing sensitive exists in this file to be read. */

var API="/api/pos", TOKEN="", CATALOGUE=null, cart=[], shift=[];
var CURAR={USD:"دولار",SYP:"ليرة سورية",AED:"درهم",SAR:"ريال",EUR:"يورو",GBP:"جنيه",TRY:"ليرة تركية"};
var METHODS=["نقدي","تحويل","بطاقة","واتساب","آجل"];

var $=function(s){return document.querySelector(s)}, $$=function(s){return [].slice.call(document.querySelectorAll(s))};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function rate(c){return (CATALOGUE&&CATALOGUE.rates[c])||1}
function fromUSD(v,c){return v*rate(c)}
function nfmt(v,c){var dec=(c==="SYP"||c==="TRY")?0:2;return Number(v||0).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec})}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on")},2400)}
function setSync(bad,txt){var el=$("#sync");el.className=bad?"bad":"";el.querySelector("span").textContent=txt}
function prod(id){return CATALOGUE.products.filter(function(p){return p.id===id})[0]}
function cur(){return $("#cur").value}

/* ── gate ── */
function unlock(){
  var v=$("#pin").value;
  if(!v) return;
  $("#pinerr").textContent="جاري التحقق…";
  fetch(API+"?pin="+encodeURIComponent(v),{cache:"no-store"}).then(function(r){
    if(r.status===401){ $("#pinerr").textContent="رمز غير صحيح"; $("#pin").value=""; $("#pin").focus(); return null; }
    if(!r.ok) throw 0;
    return r.json();
  }).then(function(d){
    if(!d) return;
    TOKEN=v; CATALOGUE=d;
    try{sessionStorage.setItem("lantana_pos_pin",v)}catch(e){}
    open_();
  }).catch(function(){ $("#pinerr").textContent="تعذّر الاتصال — تحقّق من الإنترنت"; });
}
$("#pinbtn").onclick=unlock;
$("#pin").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()});
$("#lock").onclick=function(){
  try{sessionStorage.removeItem("lantana_pos_pin")}catch(e){}
  TOKEN=""; cart=[]; $("#app").classList.remove("on"); $("#gate").style.display="grid"; $("#pin").value=""; $("#pinerr").textContent="";
};

function open_(){
  $("#gate").style.display="none"; $("#app").classList.add("on");
  $("#today").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  $("#cur").innerHTML=Object.keys(CATALOGUE.rates).map(function(c){
    return '<option '+(c===CATALOGUE.base?"selected":"")+'>'+c+'</option>'}).join("");
  $("#meth").innerHTML=METHODS.map(function(m){return '<option>'+m+'</option>'}).join("");
  shift=CATALOGUE.today||[];
  setSync(false,"متصل");
  drawProds(); drawCart(); drawShift();
}

/* ── catalogue ── */
function drawProds(){
  $("#prods").innerHTML=CATALOGUE.products.map(function(p){
    return '<button class="prod" data-p="'+p.id+'" '+(p.stock<=0?"disabled":"")+'>'+
      '<div class="nm">'+esc(p.en)+'</div><div class="ar">'+esc(p.ar)+' · '+esc(p.size)+'</div>'+
      '<div class="pr num">'+nfmt(fromUSD(p.price,cur()),cur())+'</div>'+
      '<div class="st">'+(p.stock>0?"المخزون "+p.stock:"نفد المخزون")+'</div></button>';
  }).join("");
  $$("#prods .prod").forEach(function(b){b.onclick=function(){addItem(b.dataset.p)}});
}
$("#cur").onchange=function(){drawProds();drawCart()};
$("#disc").oninput=drawCart;
$("#clear").onclick=function(){cart=[];$("#disc").value=0;drawCart()};

function addItem(id){
  var p=prod(id), c=cart.filter(function(x){return x.id===id})[0];
  if(c){ if(c.qty+1>p.stock) return toast("المتاح "+p.stock+" فقط"); c.qty++; }
  else cart.push({id:id,qty:1});
  drawCart();
}
function drawCart(){
  var c=cur();
  $("#items").innerHTML = cart.length? cart.map(function(x){var p=prod(x.id);
    return '<div class="ci"><div class="nm">'+esc(p.ar)+' · '+esc(p.size)+'</div>'+
      '<div class="qty"><button data-m="'+x.id+'">−</button><span>'+x.qty+'</span><button data-a="'+x.id+'">+</button></div>'+
      '<div class="mono-n" style="width:80px;text-align:left">'+nfmt(fromUSD(p.price*x.qty,c),c)+'</div></div>';
  }).join("") : '<div class="empty"><div class="mark mark-emb"></div>اضغط على منتج لإضافته.</div>';
  $$("#items [data-a]").forEach(function(b){b.onclick=function(){addItem(b.dataset.a)}});
  $$("#items [data-m]").forEach(function(b){b.onclick=function(){
    var x=cart.filter(function(y){return y.id===b.dataset.m})[0]; x.qty--;
    if(x.qty<=0) cart=cart.filter(function(y){return y!==x}); drawCart();
  }});
  var subUSD=cart.reduce(function(t,x){return t+prod(x.id).price*x.qty},0);
  var sub=fromUSD(subUSD,c), disc=Math.min(+$("#disc").value||0,sub), tot=sub-disc;
  $("#sum").innerHTML='<div class="row"><span>المجموع</span><span class="mono-n">'+nfmt(sub,c)+'</span></div>'+
    (disc? '<div class="row"><span>الخصم</span><span class="mono-n">−'+nfmt(disc,c)+'</span></div>':'')+
    '<div class="row tot"><span>الإجمالي</span><b class="num">'+nfmt(tot,c)+' '+c+'</b></div>';
  $("#save").disabled = !cart.length;
}

/* ── save ── */
function save(){
  if(!cart.length) return;
  var c=cur();
  var subUSD=cart.reduce(function(t,x){return t+prod(x.id).price*x.qty},0);
  var sub=fromUSD(subUSD,c), disc=Math.min(+$("#disc").value||0,sub);
  var payload={
    pin:TOKEN, cur:c, method:$("#meth").value, discount:disc,
    customer:$("#cust").value.trim(), phone:$("#phone").value.trim(),
    items:cart.map(function(x){return {id:x.id,qty:x.qty}})
  };
  $("#save").disabled=true; setSync(false,"جاري الحفظ…");
  fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)})
    .then(function(r){ if(r.status===401){ throw new Error("auth") } return r.json() })
    .then(function(d){
      if(!d||!d.sale) throw new Error("bad");
      CATALOGUE.products=d.products;
      shift.unshift(d.sale);
      receipt(d.sale);
      cart=[]; $("#disc").value=0; $("#cust").value=""; $("#phone").value="";
      drawProds(); drawCart(); drawShift();
      setSync(false,"محفوظ");
      toast("تم حفظ الفاتورة "+d.sale.no);
    })
    .catch(function(e){
      $("#save").disabled=false;
      if(e && e.message==="auth"){ setSync(true,"انتهت الجلسة"); toast("انتهت الجلسة — أعد الدخول"); }
      else { setSync(true,"لم يُحفظ"); toast("لم تُحفظ الفاتورة — أعد المحاولة"); }
    });
}
$("#save").onclick=save;

function drawShift(){
  var t={};
  shift.forEach(function(s){ t[s.cur]=(t[s.cur]||0)+s.total });
  $("#shifttot").textContent=Object.keys(t).map(function(c){return nfmt(t[c],c)+" "+c}).join(" · ")||"—";
  $("#shift").innerHTML = shift.length? shift.map(function(s){
    return '<tr><td class="mono-n">'+esc(s.no)+'</td>'+
      '<td style="color:var(--ink-60);font-size:12.5px">'+s.items.map(function(i){return esc(i.name)+"×"+i.qty}).join("، ")+'</td>'+
      '<td class="n">'+nfmt(s.total,s.cur)+' '+s.cur+'</td>'+
      '<td class="n"><button class="btn sm ghost" data-r="'+esc(s.id)+'">طباعة</button></td></tr>';
  }).join("") : '<tr><td><div class="empty"><div class="mark mark-emb"></div>لا فواتير اليوم بعد.</div></td></tr>';
  $$("#shift [data-r]").forEach(function(b){b.onclick=function(){
    receipt(shift.filter(function(s){return s.id===b.dataset.r})[0]);
  }});
}

/* ── receipt ── */
function receipt(s){
  $("#print").innerHTML='<div class="ivhead"><div class="mark mark-lock"></div>'+
    '<div style="font-size:11px;color:#5E6153">'+esc(CATALOGUE.branch||"")+'</div>'+
    '<div style="font-size:13px;margin-top:6px">فاتورة مبيع · '+esc(s.no)+'</div></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:#5E6153">'+
      '<span>'+new Date(s.date).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})+' · '+esc(s.time)+'</span>'+
      '<span>'+esc(s.customer||"زبون نقدي")+'</span></div>'+
    '<table><thead><tr><th style="text-align:right">الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>'+
      s.items.map(function(i){return '<tr><td>'+esc(i.name)+' · '+esc(i.size)+'</td><td style="text-align:center">'+i.qty+'</td>'+
        '<td style="text-align:left">'+nfmt(i.price,s.cur)+'</td><td style="text-align:left">'+nfmt(i.price*i.qty,s.cur)+'</td></tr>'}).join("")+
    '</tbody></table>'+
    (s.discount? '<div style="display:flex;justify-content:space-between;font-size:12px"><span>الخصم</span><span>−'+nfmt(s.discount,s.cur)+'</span></div>':'')+
    '<div class="tot"><span>الإجمالي · '+esc(s.method)+'</span><span>'+nfmt(s.total,s.cur)+' '+s.cur+'</span></div>'+
    '<div class="note">'+esc(CATALOGUE.footer||"")+'<br>LANTANA · لانتانا</div>';
  window.print();
}

/* ── boot ── */
setSync(false,"");
var saved=null; try{saved=sessionStorage.getItem("lantana_pos_pin")}catch(e){}
if(saved){ $("#pin").value=saved; unlock(); } else { $("#pin").focus(); }
})();
</script>
</body>
</html>
