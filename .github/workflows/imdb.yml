name: imdb-assets
on:
  push:
    branches: [imdb-assets]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[images]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download posters and stills
        run: |
          mkdir -p img
          while read -r slug poster rest; do
            curl -sSfL -A "Mozilla/5.0" -o "img/${slug}-poster.jpg" "https://m.media-amazon.com/images/M/${poster}._V1_QL88_UX1000_.jpg" || echo "fail $slug poster"
            i=1; for k in $rest; do
              curl -sSfL -A "Mozilla/5.0" -o "img/${slug}-${i}.jpg" "https://m.media-amazon.com/images/M/${k}._V1_QL88_UX1600_.jpg" || echo "fail $slug $i"
              i=$((i+1)); done
          done < list.txt
          ls -la img
      - name: Commit
        run: |
          git config user.name "akkad-assets"; git config user.email "assets@users.noreply.github.com"
          git add img && git commit -m "[images] IMDb posters and stills" && git push
